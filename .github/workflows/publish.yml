name: Publish to NPM

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: "24"
          cache: true

      - name: Format, lint and type check
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp pack

      - name: Validate package
        run: vp run check:package

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # 公開権限 (id-token) を持つジョブでは Vite+ や依存パッケージを実行せず、
  # ビルド済みの成果物を npm で公開するだけにする
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # タグの push
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
          echo "current-version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "published-version=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing では npm 11.5.1 以降が必要 (Node.js 24 に同梱)。
      # provenance は自動で付与される
      - name: Publish to NPM
        if: steps.version-check.outputs.version-changed == 'true'
        run: npm publish --access public --ignore-scripts

      - name: Create Git Tag
        if: steps.version-check.outputs.version-changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "v${{ steps.version-check.outputs.current-version }}"
          git push origin "v${{ steps.version-check.outputs.current-version }}"
